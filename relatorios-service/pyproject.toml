[project]
name = "relatorios-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Douglas Cavalcanti", email = "douglas.cteles@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "openpyxl>=3.1.5",
    "oracledb>=26.0.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "plotly>=7.0.0",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
    "xlrd>=2.0.2",
]

[project.scripts]
relatorios-service = "relatorios_service:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
