name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: report_manager
          POSTGRES_USER: report_manager
          POSTGRES_PASSWORD: report_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U report_manager -d report_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check app worker tests
      - name: Tipos
        working-directory: backend
        run: mypy app worker
      - name: Testes
        env:
          DATABASE_URL: postgresql+psycopg://report_manager:report_manager@localhost:5432/report_manager
          INTEGRATION_DATABASE_URL: postgresql+psycopg://report_manager:report_manager@localhost:5432/report_manager
          CONNECTOR_TEST_DATABASE_URL: postgresql+psycopg://report_manager:report_manager@localhost:5432/report_manager
          CONNECTOR_TEST_PASSWORD: report_manager
        run: |
          python -m alembic -c alembic.ini upgrade head
          pytest backend/tests
      - name: Verificar migrações
        env:
          DATABASE_URL: postgresql+psycopg://report_manager:report_manager@localhost:5432/report_manager
        run: python -m alembic -c alembic.ini check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Tipos
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Testes de componentes e fluxos
        working-directory: frontend
        run: npm test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar nomes de arquivos sensíveis
        run: scripts/check-sensitive-files.sh $(git ls-files)
      - name: Verificar chaves privadas
        run: |
          python -m pip install pre-commit
          pre-commit run detect-private-key --all-files
      - name: Auditar dependências Python
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: Auditar dependências JavaScript
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit não conseguiu concluir ou encontrou advisories; revisar antes do release"

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -f backend/Dockerfile -t report-manager-backend:ci .
      - name: Build sandbox
        run: docker build -f backend/sandbox.Dockerfile -t report-manager-sandbox:ci .
      - name: Build frontend production
        run: docker build -f frontend/Dockerfile.prod -t report-manager-frontend:ci frontend
