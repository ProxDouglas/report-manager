services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-report_manager}
      POSTGRES_USER: ${POSTGRES_USER:-report_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-report_manager}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - report_manager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local
      ALLOW_BOOTSTRAP: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-report_manager}:${POSTGRES_PASSWORD:-report_manager}@postgres:5432/${POSTGRES_DB:-report_manager}
      CORS_ORIGINS: http://localhost:5173
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "worker.main"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-report_manager}:${POSTGRES_PASSWORD:-report_manager}@postgres:5432/${POSTGRES_DB:-report_manager}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  report_manager_postgres_data:
