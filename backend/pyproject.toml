[build-system]
requires = ["setuptools>=75.0.0,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "report-manager-backend"
version = "0.1.0"
description = "API e worker da Plataforma de Relatórios"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.15.2",
  "argon2-cffi==23.1.0",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "matplotlib==3.10.1",
  "openpyxl==3.1.5",
  "oracledb==2.5.1",
  "pandas==2.2.3",
  "psycopg[binary]==3.2.6",
  "pydantic==2.11.3",
  "pydantic-settings==2.9.1",
  "python-multipart==0.0.20",
  "pyodbc==5.2.0",
  "reportlab==4.3.1",
  "RestrictedPython==8.2",
  "sqlalchemy==2.0.40",
  "uvicorn[standard]==0.34.2",
  "xlrd==2.0.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
  "ruff==0.11.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "worker*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "integration: requires an explicitly configured PostgreSQL or connector test service",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []
